<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léo Cotte</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  color: #000;
}

body {
  position: relative;
}

/* HEADER */

.header {
  position: fixed;
  top: 22px;
  left: 24px;
  right: 24px;
  z-index: 6000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  letter-spacing: 0.04em;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 22px;
}

.header a,
.header button {
  color: #000;
  text-decoration: none;
  font: inherit;
  letter-spacing: inherit;
}

.work {
  cursor: pointer;
}

.contact-button {
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}

.name {
  font-weight: 700;
}

/* CONTACT PAGE */

.contact-page {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 5000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.45s ease, visibility 0.45s ease;
}

.contact-page.visible {
  opacity: 1;
  visibility: visible;
}

.contact-content {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.contact-label {
  margin-bottom: 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.contact-email,
.contact-instagram {
  display: block;
  color: #000;
  text-decoration: none;
  font-size: 16px;
  line-height: 1.5;
}

.contact-instagram {
  margin-top: 4px;
}

/* CROIX */

.contact-close {
  position: absolute;
  left: calc(50% + 145px);
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: none;
  padding: 0;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 24px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  z-index: 7000;
}

/* CAROUSEL */

.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  perspective: 1200px;
  transform-style: preserve-3d;
}

.card {
  position: absolute;
  width: 220px;
  height: 150px;
  left: -110px;
  top: -75px;
  overflow: hidden;
  background: #eee;
  cursor: pointer;
  transform-origin: center center;
  will-change: transform, opacity;
  transition:
    box-shadow 0.45s ease,
    filter 0.45s ease;
}

.card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: filter 0.45s ease;
}

.card-info {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 18px 10px 9px;
  color: #fff;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0)
  );
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.card-title {
  font-size: 9px;
  line-height: 1.2;
  white-space: nowrap;
}

.card-director {
  margin-top: 3px;
  font-size: 8px;
  line-height: 1.2;
  white-space: nowrap;
}

.card.hovered {
  box-shadow: 0 20px 55px rgba(0,0,0,0.18);
}

.card.hovered img {
  filter: brightness(0.86);
}

.card.hovered .card-info {
  opacity: 1;
}

/* ARROWS */

.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2000;
  border: 0;
  background: transparent;
  color: #000;
  padding: 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  opacity: 0.7;
  cursor: pointer;
}

.arrow.left {
  left: 14px;
}

.arrow.right {
  right: 14px;
}

/* HINT */

.hint {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 2000;
  font-size: 9px;
  letter-spacing: 0.08em;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}

.hint.visible {
  opacity: 0.5;
}

/* MOBILE */

@media (max-width: 700px) {

  .header {
    top: 18px;
    left: 18px;
    right: 18px;
    font-size: 10px;
  }

  .header-left {
    gap: 18px;
  }

  .card {
    width: 170px;
    height: 116px;
    left: -85px;
    top: -58px;
  }

  .card-info {
    padding: 14px 8px 9px;
  }

  .card-title {
    font-size: 8px;
  }

  .card-director {
    font-size: 7px;
  }

  .contact-close {
    left: calc(50% + 125px);
    font-size: 23px;
  }

  .contact-email,
  .contact-instagram {
    font-size: 14px;
  }

  .arrow {
    font-size: 24px;
  }

  .arrow.left {
    left: 8px;
  }

  .arrow.right {
    right: 8px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <a
      class="work"
      href="https://vimeo.com/leocotte"
      target="_blank"
      rel="noopener noreferrer"
    >WORK</a>

    <button
      class="contact-button"
      id="contactButton"
      type="button"
    >CONTACT</button>
  </div>

  <a
    class="name"
    href="#"
    id="nameHome"
  >LÉO COTTE</a>
</header>

<!-- CONTACT -->

<div class="contact-page" id="contactPage">

  <div class="contact-content">

    <div class="contact-label">Contact</div>

    <a
      class="contact-email"
      href="mailto:leocotte.film@gmail.com"
    >leocotte.film@gmail.com</a>

    <a
      class="contact-instagram"
      href="https://www.instagram.com/leo_cotte/"
      target="_blank"
      rel="noopener noreferrer"
    >@leo_cotte</a>

  </div>

  <button
    class="contact-close"
    id="contactClose"
    aria-label="Close contact"
  >×</button>

</div>

<!-- CAROUSEL -->

<div class="stage" id="stage"></div>

<button
  class="arrow left"
  id="left"
  aria-label="Previous"
>‹</button>

<button
  class="arrow right"
  id="right"
  aria-label="Next"
>›</button>

<div class="hint" id="hint">Scroll to explore</div>

<script>

const projects = [

  {
    id: "1225990779",
    title: "THE GIRL FROM - A JOURNEY IN JAPAN",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225628524",
    title: "GIRO - WITHE RUSH",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225972567",
    title: "WARREN ZAÏRE-EMERY x LOUIS VUITTON",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  },

  {
    id: "1225623187",
    title: "LEBONCOIN - L'INVENTAIRE",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  },

  {
    id: "1225954902",
    title: "NOREPLY",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225687477",
    title: "ST DUPONT - MY MOM'S BAG",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  },

  {
    id: "1225653579",
    title: "LIQUIDE IMAGINAIRE - IMAGINARIUM#1",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225629634",
    title: "RILES - INTO THE FLAMME",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  },

  {
    id: "1225653580",
    title: "LIQUIDE IMAGINAIRE - IMAGINARIUM#2",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225961767",
    title: "ST DUPONT - FW 2025",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225920079",
    title: "ADIDAS RS15 Pro x Antoine Dupont",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  },

  {
    id: "1225656943",
    title: "LIQUIDE IMAGINAIRE - BLANCHE BÊTE",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225626001",
    title: "LOUIS VUITTON - FRAGMENT OF HISTORY",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  },

  {
    id: "1230217532",
    title: "PARFUMS DE MARLY - BLEU ROI",
    director: "Directed by Léo Cotte"
  },

  {
    id: "1225920065",
    title: "A L'INTERIEUR - ANTOINE DUPONT",
    director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
  }

];

const stage = document.getElementById("stage");
const hint = document.getElementById("hint");

const contactButton =
  document.getElementById("contactButton");

const contactPage =
  document.getElementById("contactPage");

const contactClose =
  document.getElementById("contactClose");

const nameHome =
  document.getElementById("nameHome");

function closeContact() {
  contactPage.classList.remove("visible");
}

contactButton.addEventListener("click", () => {
  contactPage.classList.add("visible");
});

contactClose.addEventListener(
  "click",
  closeContact
);

nameHome.addEventListener("click", event => {
  event.preventDefault();
  closeContact();
});

window.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeContact();
  }

});

/* CREATE CARDS */

const cards = projects.map(project => {

  const card =
    document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <img
      src="https://vumbnail.com/${project.id}.jpg"
      alt="${project.title}"
    >

    <div class="card-info">

      <div class="card-title">
        ${project.title}
      </div>

      <div class="card-director">
        ${project.director}
      </div>

    </div>
  `;

  card.addEventListener("click", () => {

    window.open(
      `https://vimeo.com/${project.id}`,
      "_blank",
      "noopener,noreferrer"
    );

  });

  card.addEventListener("mouseenter", () => {
    card.classList.add("hovered");
  });

  card.addEventListener("mouseleave", () => {
    card.classList.remove("hovered");
  });

  card.hoverAmount = 0;

  stage.appendChild(card);

  return card;

});

/* CAROUSEL */

let rotation = 0;
let scrollVelocity = 0;

const count = projects.length;

/*
  Louis Vuitton est maintenant à l'index 12.
  Il reste donc parfaitement au centre
  à la fin de l'intro.
*/

const targetIndex = 12;

const targetRotation =
  -(targetIndex / count) * Math.PI * 2;

const introDuration = 4200;
const introStartScale = 0.35;

let introStart = performance.now();
let introFinished = false;

function render(now) {

  const elapsed =
    now - introStart;

  const introProgress =
    Math.min(
      elapsed / introDuration,
      1
    );

  if (!introFinished) {

    const eased =
      1 -
      Math.pow(
        1 - introProgress,
        3.8
      );

    rotation =
      targetRotation +
      eased * Math.PI * 2;

    const introScale =
      introStartScale +
      (1 - introStartScale) *
      eased;

    stage.style.transform =
      `scale(${introScale})`;

    stage.style.opacity =
      Math.min(
        introProgress * 2.2,
        1
      );

    if (introProgress >= 1) {

      introFinished = true;

      rotation = targetRotation;

      stage.style.transform =
        "scale(1)";

      stage.style.opacity = "1";

      hint.classList.add("visible");
    }

  } else {

    rotation += scrollVelocity;

    scrollVelocity *= 0.94;

    if (
      Math.abs(scrollVelocity) <
      0.000003
    ) {
      scrollVelocity = 0;
    }

  }

  const width =
    window.innerWidth;

  const radiusX =
    Math.max(
      620,
      Math.min(
        900,
        width * 0.43
      )
    );

  const radiusY =
    Math.max(
      85,
      Math.min(
        135,
        width * 0.065
      )
    );

  cards.forEach((card, index) => {

    const angle =
      (index / count) *
      Math.PI * 2 +
      rotation;

    const x =
      Math.sin(angle) *
      radiusX;

    const y =
      -(1 - Math.cos(angle)) *
      radiusY;

    const depth =
      (Math.cos(angle) + 1) /
      2;

    const baseScale =
      0.62 +
      depth * 0.48;

    const baseOpacity =
      0.62 +
      depth * 0.38;

    const targetHover =
      card.classList.contains("hovered")
        ? 1
        : 0;

    card.hoverAmount +=
      (
        targetHover -
        card.hoverAmount
      ) * 0.12;

    const hoverScale =
      1 +
      card.hoverAmount * 0.30;

    const finalScale =
      baseScale *
      hoverScale;

    card.style.transform =
      `translate3d(
        ${x}px,
        ${y}px,
        ${depth * 120}px
      ) scale(${finalScale})`;

    card.style.opacity =
      baseOpacity;

    card.style.zIndex =
      Math.round(depth * 1000) +
      (
        card.hoverAmount > 0.01
          ? 1000
          : 0
      );

  });

  requestAnimationFrame(render);
}

/* TRACKPAD */

window.addEventListener(
  "wheel",
  event => {

    if (!introFinished) return;

    const delta =
      Math.max(
        -80,
        Math.min(
          80,
          event.deltaY
        )
      );

    scrollVelocity +=
      delta * 0.00045;

    scrollVelocity =
      Math.max(
        -0.055,
        Math.min(
          0.055,
          scrollVelocity
        )
      );

  },
  {
    passive: true
  }
);

/* ARROWS */

document
  .getElementById("left")
  .addEventListener(
    "click",
    () => {

      if (!introFinished) return;

      scrollVelocity -= 0.025;

    }
  );

document
  .getElementById("right")
  .addEventListener(
    "click",
    () => {

      if (!introFinished) return;

      scrollVelocity += 0.025;

    }
  );

/* KEYBOARD */

window.addEventListener(
  "keydown",
  event => {

    if (!introFinished) return;

    if (
      event.key ===
      "ArrowLeft"
    ) {
      scrollVelocity -= 0.025;
    }

    if (
      event.key ===
      "ArrowRight"
    ) {
      scrollVelocity += 0.025;
    }

  }
);

window.addEventListener(
  "resize",
  () => {
    /* Geometry recalculated automatically */
  }
);

requestAnimationFrame(render);

</script>

</body>
</html>
