<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LÉO COTTE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    /* HEADER */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      pointer-events: none;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 28px;
      pointer-events: auto;
    }

    .header-link,
    .name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      line-height: 1;
      text-decoration: none;
      color: #000;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    .header-link {
      font-weight: 400;
      background: none;
      border: none;
      padding: 0;
    }

    .name {
      font-weight: 700 !important;
      color: #000;
      pointer-events: auto;
    }

    /* CAROUSEL */

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 220px;
      height: 150px;
      margin-left: -110px;
      margin-top: -75px;
      overflow: hidden;
      cursor: pointer;
      background: #eee;
      transform-origin: center center;
      will-change: transform, opacity;
      transition:
        box-shadow 0.45s ease,
        filter 0.45s ease;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(1);
      transition: filter 0.45s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .card.hovered {
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.18);
    }

    .card.hovered img {
      filter: brightness(0.86);
    }

    .card-info {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 10px 10px;
      color: #fff;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.68),
        rgba(0, 0, 0, 0)
      );
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    .card.hovered .card-info {
      opacity: 1;
    }

    .card-title {
      font-size: 9px;
      line-height: 1.2;
      font-weight: 400;
      white-space: nowrap;
      margin-bottom: 3px;
    }

    .card-director {
      font-size: 8px;
      line-height: 1.2;
      font-weight: 400;
      white-space: nowrap;
      opacity: 0.85;
    }

    /* ARROWS */

    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3000;
      width: 40px;
      height: 60px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 28px;
      font-weight: 300;
      line-height: 60px;
      text-align: center;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .arrow:hover {
      opacity: 1;
    }

    .arrow-left {
      left: 24px;
    }

    .arrow-right {
      right: 24px;
    }

    /* HINT */

    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 3000;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #000;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .hint.visible {
      opacity: 0.5;
    }

    /* CONTACT */

    .contact-overlay {
      position: fixed;
      inset: 0;
      z-index: 5500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .contact-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .contact-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .contact-label {
      margin-bottom: 14px;
      font-size: 11px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .contact-email,
    .contact-instagram {
      font-size: 16px;
      line-height: 1.35;
      font-weight: 400;
      color: #000;
      text-decoration: none;
    }

    .contact-instagram {
      margin-top: 2px;
    }

    .contact-close {
      position: absolute;
      left: calc(50% + 145px);
      top: calc(50% - 28px);
      transform: translateY(-50%);
      width: 25px;
      height: 25px;
      padding: 0;
      border: none;
      background: transparent;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 300;
      line-height: 25px;
      text-align: center;
      cursor: pointer;
    }

    /* INTRO */

    .intro-white {
      position: fixed;
      inset: 0;
      z-index: 4500;
      background: #fff;
      pointer-events: none;
      opacity: 1;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 18px;
      }

      .header-left {
        gap: 22px;
      }

      .header-link,
      .name {
        font-size: 10px;
      }

      .name {
        font-weight: 700 !important;
      }

      .card {
        width: 170px;
        height: 116px;
        margin-left: -85px;
        margin-top: -58px;
      }

      .card-info {
        padding: 14px 8px 9px;
      }

      .card-title {
        font-size: 8px;
      }

      .card-director {
        font-size: 7px;
      }

      .arrow {
        width: 32px;
        height: 50px;
        font-size: 23px;
        line-height: 50px;
      }

      .arrow-left {
        left: 7px;
      }

      .arrow-right {
        right: 7px;
      }

      .hint {
        bottom: 18px;
        font-size: 8px;
      }

      .contact-email,
      .contact-instagram {
        font-size: 15px;
      }

      .contact-label {
        font-size: 10px;
      }

      .contact-close {
        left: calc(50% + 125px);
        top: calc(50% - 28px);
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="header-left">

      <a
        class="header-link"
        href="https://vimeo.com/leocotte"
        target="_blank"
        rel="noopener noreferrer"
      >
        WORK
      </a>

      <button
        class="header-link"
        id="contactButton"
        type="button"
      >
        CONTACT
      </button>

    </div>

    <a
      class="name"
      href="#"
      id="homeButton"
    >
      LÉO COTTE
    </a>

  </header>


  <!-- CAROUSEL -->

  <div
    class="stage"
    id="stage"
  ></div>


  <!-- ARROWS -->

  <button
    class="arrow arrow-left"
    id="arrowLeft"
    type="button"
    aria-label="Previous"
  >
    ‹
  </button>

  <button
    class="arrow arrow-right"
    id="arrowRight"
    type="button"
    aria-label="Next"
  >
    ›
  </button>


  <!-- HINT -->

  <div
    class="hint"
    id="hint"
  >
    Scroll to explore
  </div>


  <!-- CONTACT -->

  <div
    class="contact-overlay"
    id="contactOverlay"
  >

    <div class="contact-content">

      <div class="contact-label">
        Contact
      </div>

      <a
        class="contact-email"
        href="mailto:leocotte.film@gmail.com"
      >
        leocotte.film@gmail.com
      </a>

      <a
        class="contact-instagram"
        href="https://www.instagram.com/leo_cotte/"
        target="_blank"
        rel="noopener noreferrer"
      >
        @leo_cotte
      </a>

    </div>

    <button
      class="contact-close"
      id="contactClose"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

  </div>


  <!-- WHITE INTRO -->

  <div
    class="intro-white"
    id="introWhite"
  ></div>


  <script>

    const projects = [

      {
        id: "1225990779",
        title: "THE GIRL FROM - A JOURNEY IN JAPAN",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225628524",
        title: "GIRO - WITHE RUSH",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225972567",
        title: "WARREN ZAÏRE-EMERY x LOUIS VUITTON",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      },

      {
        id: "1225623187",
        title: "LEBONCOIN - L'INVENTAIRE",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      },

      {
        id: "1225954902",
        title: "NOREPLY",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225687477",
        title: "ST DUPONT - MY MOM'S BAG",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      },

      {
        id: "1225653579",
        title: "LIQUIDE IMAGINAIRE - IMAGINARIUM#1",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225629634",
        title: "RILES - INTO THE FLAMME",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      },

      {
        id: "1225653580",
        title: "LIQUIDE IMAGINAIRE - IMAGINARIUM#2",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225961767",
        title: "ST DUPONT - FW 2025",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225920079",
        title: "ADIDAS RS15 Pro x Antoine Dupont",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      },

      {
        id: "1225656943",
        title: "LIQUIDE IMAGINAIRE - BLANCHE BÊTE",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225626001",
        title: "LOUIS VUITTON - FRAGMENT OF HISTORY",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      },

      {
        id: "1230217532",
        title: "PARFUMS DE MARLY - BLEU ROI",
        director: "Directed by Léo Cotte"
      },

      {
        id: "1225920065",
        title: "A L'INTERIEUR - ANTOINE DUPONT",
        director: "Directed by BIFACE (Léo Cotte & Paul Montarlier)"
      }

    ];


    const stage =
      document.getElementById("stage");

    const hint =
      document.getElementById("hint");

    const introWhite =
      document.getElementById("introWhite");

    const contactButton =
      document.getElementById("contactButton");

    const contactOverlay =
      document.getElementById("contactOverlay");

    const contactClose =
      document.getElementById("contactClose");

    const homeButton =
      document.getElementById("homeButton");

    const arrowLeft =
      document.getElementById("arrowLeft");

    const arrowRight =
      document.getElementById("arrowRight");


    let cards = [];

    let rotation = 0;

    let scrollVelocity = 0;

    let introStartTime = null;

    let introFinished = false;


    const targetIndex = 12;

    const count =
      projects.length;


    const targetRotation =
      -(targetIndex / count) *
      Math.PI *
      2;


    const introDuration = 4200;

    const introStartScale = 0.35;


    /* CREATE CARDS */

    projects.forEach(
      (project) => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `
          <img
            src="https://vumbnail.com/${project.id}.jpg"
            alt="${project.title}"
            draggable="false"
          >

          <div class="card-info">

            <div class="card-title">
              ${project.title}
            </div>

            <div class="card-director">
              ${project.director}
            </div>

          </div>
        `;


        card.addEventListener(
          "mouseenter",
          () => {
            card.classList.add("hovered");
          }
        );


        card.addEventListener(
          "mouseleave",
          () => {
            card.classList.remove("hovered");
          }
        );


        card.addEventListener(
          "click",
          () => {

            window.open(
              `https://vimeo.com/${project.id}`,
              "_blank",
              "noopener,noreferrer"
            );

          }
        );


        card.hoverAmount = 0;

        stage.appendChild(card);

        cards.push(card);

      }
    );


    /* RENDER */

    function render() {

      const width =
        window.innerWidth;


      const radiusX =
        Math.max(
          620,
          Math.min(
            900,
            width * 0.43
          )
        );


      const radiusY =
        Math.max(
          85,
          Math.min(
            135,
            width * 0.065
          )
        );


      let globalScale = 1;

      let introOpacity = 1;


      if (!introFinished) {

        const elapsed =
          performance.now() -
          introStartTime;


        const progress =
          Math.min(
            elapsed / introDuration,
            1
          );


        const eased =
          1 -
          Math.pow(
            1 - progress,
            3.8
          );


        /*
          EXACTLY ONE FULL REVOLUTION
          AND FINAL POSITION ON
          LOUIS VUITTON
        */

        rotation =
          targetRotation +
          eased *
          Math.PI *
          2;


        globalScale =
          introStartScale +
          (1 - introStartScale) *
          eased;


        introOpacity =
          Math.min(
            progress * 2.2,
            1
          );


        /*
          THE WHITE SCREEN NOW FADES
          WHILE THE CAROUSEL IS VISIBLE
        */

        introWhite.style.opacity =
          1 - eased;


        if (progress >= 1) {

          introFinished = true;

          rotation =
            targetRotation;

          scrollVelocity = 0;

          introWhite.style.opacity = 0;

          hint.classList.add("visible");

        }

      } else {

        rotation +=
          scrollVelocity;


        scrollVelocity *=
          0.94;


        if (
          Math.abs(scrollVelocity) <
          0.000003
        ) {

          scrollVelocity = 0;

        }

      }


      cards.forEach(
        (card, index) => {

          const angle =
            rotation +
            (index / count) *
            Math.PI *
            2;


          const x =
            Math.sin(angle) *
            radiusX;


          const y =
            -(1 - Math.cos(angle)) *
            radiusY;


          const depth =
            (Math.cos(angle) + 1) / 2;


          const scale =
            0.62 +
            depth * 0.48;


          const opacity =
            0.62 +
            depth * 0.38;


          const targetHover =
            card.classList.contains(
              "hovered"
            )
              ? 1
              : 0;


          card.hoverAmount +=
            (
              targetHover -
              card.hoverAmount
            ) * 0.12;


          const hoverScale =
            1 +
            card.hoverAmount * 0.30;


          card.style.transform = `
            translate3d(
              ${x}px,
              ${y}px,
              0
            )
            scale(
              ${scale *
                hoverScale *
                globalScale}
            )
          `;


          card.style.opacity =
            opacity *
            introOpacity;


          card.style.zIndex =
            Math.round(
              depth * 100
            ) +
            (
              card.hoverAmount > 0.01
                ? 1000
                : 0
            );

        }
      );


      requestAnimationFrame(
        render
      );

    }


    /* TRACKPAD */

    window.addEventListener(
      "wheel",
      (event) => {

        if (!introFinished) {
          return;
        }


        const delta =
          Math.max(
            -80,
            Math.min(
              80,
              event.deltaY
            )
          );


        scrollVelocity +=
          delta * 0.00045;


        scrollVelocity =
          Math.max(
            -0.055,
            Math.min(
              0.055,
              scrollVelocity
            )
          );

      },
      {
        passive: true
      }
    );


    /* ARROWS */

    arrowLeft.addEventListener(
      "click",
      () => {

        if (!introFinished) {
          return;
        }

        scrollVelocity -=
          0.025;

      }
    );


    arrowRight.addEventListener(
      "click",
      () => {

        if (!introFinished) {
          return;
        }

        scrollVelocity +=
          0.025;

      }
    );


    /* KEYBOARD */

    window.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape" &&
          contactOverlay.classList.contains(
            "active"
          )
        ) {

          closeContact();

          return;

        }


        if (!introFinished) {
          return;
        }


        if (
          event.key === "ArrowLeft"
        ) {

          scrollVelocity -=
            0.025;

        }


        if (
          event.key === "ArrowRight"
        ) {

          scrollVelocity +=
            0.025;

        }

      }
    );


    /* CONTACT */

    function openContact() {

      contactOverlay.classList.add(
        "active"
      );

    }


    function closeContact() {

      contactOverlay.classList.remove(
        "active"
      );

    }


    contactButton.addEventListener(
      "click",
      openContact
    );


    contactClose.addEventListener(
      "click",
      closeContact
    );


    homeButton.addEventListener(
      "click",
      (event) => {

        event.preventDefault();

        closeContact();

      }
    );


    /* START */

    introStartTime =
      performance.now();


    requestAnimationFrame(
      render
    );

  </script>

</body>
</html>
